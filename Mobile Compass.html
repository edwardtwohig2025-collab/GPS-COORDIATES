<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#090c10" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Mobile Compass</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    html, body {
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #090c10;
      color: #f0f6fc;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: env(safe-area-inset-top, 16px) 20px env(safe-area-inset-bottom, 24px);
    }

    /* Top Heading Display */
    .header {
      text-align: center;
      margin-top: 10px;
    }
    .degree-display {
      font-size: 3.4rem;
      font-weight: 800;
      letter-spacing: -1px;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .direction-label {
      font-size: 1.2rem;
      font-weight: 600;
      color: #ff453a;
      margin-top: 4px;
      letter-spacing: 2px;
    }

    /* Responsive Mobile Compass Dial */
    .compass-stage {
      position: relative;
      width: min(82vw, 340px);
      height: min(82vw, 340px);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .lubber-line {
      position: absolute;
      top: -16px;
      width: 4px;
      height: 24px;
      background: #ff453a;
      border-radius: 2px;
      z-index: 20;
      box-shadow: 0 0 10px rgba(255, 69, 58, 0.8);
    }
    .dial-ring {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: radial-gradient(circle, #161b22 58%, #0d1117 100%);
      border: 3px solid #21262d;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.75), inset 0 0 25px rgba(0, 0, 0, 0.9);
      will-change: transform;
    }
    .tick {
      position: absolute;
      top: 0;
      left: 50%;
      width: 2px;
      height: 10px;
      background: #484f58;
      transform-origin: 50% min(41vw, 170px);
    }
    .tick.major {
      width: 3px;
      height: 16px;
      background: #c9d1d9;
    }
    .cardinal {
      position: absolute;
      font-weight: 800;
      font-size: 1.35rem;
    }
    .n { top: 22px; left: 50%; transform: translateX(-50%); color: #ff453a; }
    .s { bottom: 22px; left: 50%; transform: translateX(-50%); color: #8b949e; }
    .e { right: 24px; top: 50%; transform: translateY(-50%); color: #8b949e; }
    .w { left: 24px; top: 50%; transform: translateY(-50%); color: #8b949e; }

    /* Center Crosshair & Needle */
    .crosshair {
      position: absolute;
      width: 70px;
      height: 70px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 50%;
      pointer-events: none;
    }
    .crosshair::before, .crosshair::after {
      content: "";
      position: absolute;
      background: rgba(255, 255, 255, 0.18);
    }
    .crosshair::before { width: 1px; height: 100%; left: 50%; }
    .crosshair::after { height: 1px; width: 100%; top: 50%; }

    /* Bottom GPS & Permission Bar */
    .footer {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      text-align: center;
    }
    .gps-box {
      background: #161b22;
      border: 1px solid #21262d;
      border-radius: 14px;
      padding: 12px;
      font-size: 0.9rem;
      color: #8b949e;
      font-variant-numeric: tabular-nums;
    }
    .gps-box strong { color: #f0f6fc; display: block; margin-top: 2px; font-size: 0.95rem; }
    .start-btn {
      width: 100%;
      padding: 15px;
      border-radius: 14px;
      border: none;
      background: #238636;
      color: #ffffff;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(35, 134, 54, 0.4);
    }
    .start-btn:active { transform: scale(0.98); }
    .start-btn.active { background: #1f6feb; box-shadow: none; }
  </style>
</head>
<body>

  <div class="header">
    <div class="degree-display" id="degText">0°</div>
    <div class="direction-label" id="dirText">NORTH</div>
  </div>

  <div class="compass-stage">
    <div class="lubber-line"></div>
    <div class="dial-ring" id="dial">
      <span class="cardinal n">N</span>
      <span class="cardinal e">E</span>
      <span class="cardinal s">S</span>
      <span class="cardinal w">W</span>
    </div>
    <div class="crosshair"></div>
  </div>

  <div class="footer">
    <div class="gps-box">
      GPS COORDINATES
      <strong id="gpsText">Tap below to enable sensors</strong>
    </div>
    <button class="start-btn" id="startBtn" onclick="initMobileSensors()">Start Compass & GPS</button>
  </div>

  <script>
    const dial = document.getElementById('dial');
    const degText = document.getElementById('degText');
    const dirText = document.getElementById('dirText');
    const gpsText = document.getElementById('gpsText');
    const startBtn = document.getElementById('startBtn');

    // Generate 36 degree ticks around dial
    for (let i = 0; i < 360; i += 10) {
      const tick = document.createElement('div');
      tick.className = i % 30 === 0 ? 'tick major' : 'tick';
      tick.style.transform = `translateX(-50%) rotate(${i}deg)`;
      dial.appendChild(tick);
    }

    let currentAngle = 0;
    let targetAngle = 0;

    function getFullDirection(deg) {
      const names = ['NORTH', 'NORTHEAST', 'EAST', 'SOUTHEAST', 'SOUTH', 'SOUTHWEST', 'WEST', 'NORTHWEST'];
      return names[Math.round(deg / 45) % 8];
    }

    // Smooth shortest-path rotation loop (prevents 359° -> 0° spin glitch)
    function animateDial() {
      let diff = ((targetAngle - currentAngle + 540) % 360) - 180;
      currentAngle = (currentAngle + diff * 0.18 + 360) % 360;

      dial.style.transform = `rotate(${-currentAngle}deg)`;
      const rounded = Math.round(currentAngle) % 360;
      degText.textContent = `${rounded}°`;
      dirText.textContent = getFullDirection(rounded);

      requestAnimationFrame(animateDial);
    }
    requestAnimationFrame(animateDial);

    function onOrientation(e) {
      let heading = null;
      if (typeof e.webkitCompassHeading === 'number') {
        heading = e.webkitCompassHeading; // iOS
      } else if (e.alpha !== null) {
        heading = (360 - e.alpha) % 360; // Android
      }
      if (heading !== null) targetAngle = heading;
    }

    async function initMobileSensors() {
      // 1. Request Compass Orientation
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        try {
          const perm = await DeviceOrientationEvent.requestPermission();
          if (perm === 'granted') {
            window.addEventListener('deviceorientation', onOrientation, true);
          } else {
            alert('Compass permission denied.');
          }
        } catch (err) {
          alert('Sensor error: ' + err.message);
        }
      } else {
        window.addEventListener('deviceorientationabsolute', onOrientation, true);
        window.addEventListener('deviceorientation', onOrientation, true);
      }

      // 2. Request GPS Coordinates
      if ('geolocation' in navigator) {
        navigator.geolocation.watchPosition(
          (pos) => {
            const lat = pos.coords.latitude.toFixed(5);
            const lon = pos.coords.longitude.toFixed(5);
            gpsText.textContent = `${lat}°, ${lon}°`;
          },
          () => {
            gpsText.textContent = 'GPS unavailable or denied';
          },
          { enableHighAccuracy: true }
        );
      }

      startBtn.textContent = 'Sensors Active';
      startBtn.classList.add('active');
    }
  </script>
</body>
</html>
